# Sauvegarde automatique de la base hébergée (démonstration vavang), avec rotation à plusieurs échéances.
# Zéro euro : dépôt public, minutes GitHub Actions gratuites ; aucun secret obligatoire (compte de démonstration public).
#
# Plan de sauvegarde (l'échéance est écrite dans le nom de l'artefact) :
#   courante      toutes les 3 h (minute 17 UTC)          artefact conservé  3 jours
#   quotidienne   chaque jour à 02:17 UTC (sauf dimanche)  artefact conservé 30 jours
#   hebdomadaire  le dimanche à 02:17 UTC                  artefact conservé 90 jours (maximum GitHub pour un dépôt public)
#   mensuelle     1er dimanche du mois, SEULEMENT si le secret SAUVEGARDE_CLE existe : archive CHIFFRÉE publiée en
#                 « release » GitHub (sans limite de durée), les 12 plus récentes sont gardées. Sans le secret : rien.
# Deux planifications seulement : l'échéance est déduite de celle qui a déclenché l'exécution (github.event.schedule).
#
# Si le secret SAUVEGARDE_CLE existe, la sauvegarde est chiffrée par tests/chiffrement-sauvegarde.mjs (AES-256-GCM, clé dérivée
# par scrypt), puis l'archive chiffrée est relue et contrôlée (tests/restauration.mjs --controle-seul) avant publication.
# Sans le secret : si la variable de dépôt SAUVEGARDE_CHIFFREMENT vaut « obligatoire » (instance de production), l'exécution
# échoue et rien n'est publié ; sinon (démonstration, données fictives) l'archive est publiée en clair avec un avertissement.
# Sur un dépôt public, les artefacts sont téléchargeables par toute personne connectée à GitHub, et les releases par tout le
# monde : c'est pourquoi la release exige le chiffrement.
name: Sauvegarde de la base

on:
  schedule:
    - cron: '17 */3 * * *'   # courante : toutes les 3 h à la minute 17 UTC (RPO cible 3 h, CCTP 3.7.7 : 4 h ; minute décalée, les créneaux « pile » sont souvent retardés)
    - cron: '17 2 * * *'     # quotidienne (hebdomadaire le dimanche) : 02:17 UTC, soit 06:17 à La Réunion
  workflow_dispatch:
    inputs:
      echeance:
        description: 'Échéance de la sauvegarde lancée à la main'
        type: choice
        options: [courante, quotidienne, hebdomadaire]
        default: courante

permissions:
  contents: read

concurrency:
  group: sauvegarde
  cancel-in-progress: false

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artefact: ${{ steps.echeance.outputs.artefact }}
      mensuelle: ${{ steps.archive.outputs.mensuelle }}
      mois: ${{ steps.echeance.outputs.mois }}
    env:
      CHROME: /usr/bin/google-chrome
      VAVANG_URL: https://psyc01-cpu.github.io/vavang-demo/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances (versions figées par package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sauvegarde (export de la base + fichiers + empreintes SHA-256)
        id: sauvegarde
        run: node tests/sauvegarde.mjs sauvegardes

      - name: Vérification des empreintes
        working-directory: sauvegardes/${{ steps.sauvegarde.outputs.nom }}
        run: sha256sum -c --quiet SHA256SUMS && echo "Empreintes vérifiées."

      - name: Échéance et durée de conservation
        id: echeance
        env:
          PLANIFICATION: ${{ github.event.schedule }}
          MANUELLE: ${{ inputs.echeance }}
          NOM: ${{ steps.sauvegarde.outputs.nom }}
        run: |
          if [ -n "$MANUELLE" ]; then ECHEANCE="$MANUELLE"
          elif [ "$PLANIFICATION" = "17 2 * * *" ]; then
            if [ "$(date -u +%u)" = "7" ]; then ECHEANCE=hebdomadaire; else ECHEANCE=quotidienne; fi
          else ECHEANCE=courante; fi
          case "$ECHEANCE" in
            courante) JOURS=3 ;; quotidienne) JOURS=30 ;; hebdomadaire) JOURS=90 ;;
            *) echo "Échéance inconnue : $ECHEANCE"; exit 1 ;;
          esac
          ARTEFACT="sauvegarde-$ECHEANCE-${NOM#sauvegarde-}"
          echo "Échéance : $ECHEANCE ; conservation : $JOURS jours ; artefact : $ARTEFACT"
          { echo "echeance=$ECHEANCE"; echo "jours=$JOURS"; echo "artefact=$ARTEFACT"; echo "mois=$(date -u +%Y%m)"; } >> "$GITHUB_OUTPUT"

      - name: Archive (chiffrée si le secret SAUVEGARDE_CLE existe ; obligatoire en production)
        id: archive
        env:
          SAUVEGARDE_CLE: ${{ secrets.SAUVEGARDE_CLE }}
          SAUVEGARDE_CHIFFREMENT: ${{ vars.SAUVEGARDE_CHIFFREMENT }}
          NOM: ${{ steps.sauvegarde.outputs.nom }}
          ECHEANCE: ${{ steps.echeance.outputs.echeance }}
        run: |
          mkdir -p artefact
          MENSUELLE=non
          if [ -n "$SAUVEGARDE_CLE" ]; then
            node tests/chiffrement-sauvegarde.mjs chiffrer "sauvegardes/$NOM" --sortie artefact --supprimer-clair
            node tests/restauration.mjs "artefact/$NOM.vvs" --controle-seul
            rm -f "artefact/$NOM.vvs.sha256"
            echo "Archive chiffrée (AES-256-GCM, clé dérivée par scrypt) et contrôlée après déchiffrement."
            echo "Déchiffrer : SAUVEGARDE_CLE=… node tests/chiffrement-sauvegarde.mjs dechiffrer $NOM.vvs <destination>"
            # copie mensuelle : la sauvegarde hebdomadaire du premier dimanche du mois (jour 1 à 7), chiffrée uniquement
            if [ "$ECHEANCE" = "hebdomadaire" ] && [ "$(date -u +%-d)" -le 7 ]; then MENSUELLE=oui; fi
          elif [ "$SAUVEGARDE_CHIFFREMENT" = "obligatoire" ]; then
            echo "::error title=Sauvegarde refusée::Chiffrement obligatoire et secret SAUVEGARDE_CLE absent : rien n'est publié."
            rm -rf sauvegardes; exit 1
          else
            tar -C sauvegardes -czf "artefact/$NOM.tar.gz" "$NOM"
            echo "::warning title=Sauvegarde non chiffrée::Secret SAUVEGARDE_CLE absent : archive publiée EN CLAIR (acceptable uniquement parce que les données de la démonstration sont fictives). Aucune copie mensuelle en release."
          fi
          echo "mensuelle=$MENSUELLE" >> "$GITHUB_OUTPUT"
          (cd artefact && sha256sum * > "$NOM.archive.sha256" && cat "$NOM.archive.sha256")
          rm -rf sauvegardes

      - name: Publication en artefact (${{ steps.echeance.outputs.echeance }}, ${{ steps.echeance.outputs.jours }} jours)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.echeance.outputs.artefact }}
          path: artefact/
          retention-days: ${{ steps.echeance.outputs.jours }}
          if-no-files-found: error

  # Copie mensuelle en release : uniquement une archive chiffrée (jamais de données en clair dans une release publique).
  mensuelle:
    needs: sauvegarde
    if: needs.sauvegarde.outputs.mensuelle == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # créer la release et supprimer les plus anciennes (ce job seulement)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIQUETTE: sauvegarde-mensuelle-${{ needs.sauvegarde.outputs.mois }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sauvegarde.outputs.artefact }}
          path: artefact

      - name: Contrôle (archive chiffrée et empreinte)
        working-directory: artefact
        run: |
          ls *.vvs >/dev/null 2>&1 || { echo "Aucune archive chiffrée : rien n'est publié."; exit 1; }
          if ls *.tar.gz >/dev/null 2>&1; then echo "Archive en clair présente : publication refusée."; exit 1; fi
          sha256sum -c --quiet *.archive.sha256 && echo "Empreinte de l'archive vérifiée."

      - name: Release mensuelle (une par mois, 12 gardées)
        run: |
          if gh release view "$ETIQUETTE" >/dev/null 2>&1; then echo "La release $ETIQUETTE existe déjà : rien à faire."; exit 0; fi
          gh release create "$ETIQUETTE" artefact/* --target "$GITHUB_SHA" --latest=false \
            --title "Sauvegarde mensuelle $ETIQUETTE (chiffrée)" \
            --notes "Archive chiffrée (AES-256-GCM, clé dérivée par scrypt) de la base. Déchiffrement : SAUVEGARDE_CLE=… node tests/chiffrement-sauvegarde.mjs dechiffrer <fichier>.vvs <destination> (phrase de passe conservée hors de GitHub)."
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^sauvegarde-mensuelle-' | sort -r | tail -n +13 | while read -r ancienne; do
            echo "Suppression de la release de plus de 12 mois : $ancienne"
            gh release delete "$ancienne" --yes --cleanup-tag
          done
